name: Jarvis tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  headless-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies without voice models
        run: python -m pip install -e ".[dev,intelligence]"
      - name: Import and compile
        run: |
          python -c "import jarvis; import jarvis.intelligence.dialogue_manager; import jarvis.core.voice_session"
          python -m compileall -q jarvis scripts tests
      - name: Unit, context, authorization and simulated integration tests
        run: python -m pytest -q --strict-markers -m "not models and not native and not gui and not hardware"

  next-offline:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Next without intelligence or voice extras
        run: python -m pip install -e ".[dev,next]"
      - name: Verify no local model packages are installed
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(x) is None for x in ('onnxruntime', 'tokenizers', 'moonshine_voice', 'torch'))"
      - name: Offline Next contracts, policies, deadlines and CLI
        run: python -m pytest -q --strict-markers tests/test_next_foundation.py tests/test_next_groq.py tests/test_next_review.py tests/test_next_pilot.py
