[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-always-on-core"
version = "0.3.0"
description = "Local Windows wake-word resident, phase 1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6", "sounddevice==0.5.2", "soxr==0.5.0.post1",
  "PySide6-Essentials==6.8.3", "psutil==7.0.0", "pycaw==20251023",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
voice = ["moonshine-voice==0.1.6", "faster-whisper==1.2.1", "piper-tts==1.8.0", "onnxruntime==1.31.1"]
intelligence = ["pydantic==2.12.5", "onnxruntime==1.31.1", "tokenizers==0.23.3", "huggingface-hub==2.4.0"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
